/* Layout: a Luna-era desktop. One app window (title bar, menu bar, volume list, before/after cluster maps, buttons, legend, status bar) on a hill-and-sky wallpaper, taskbar below. */
:root{
  --sky-a:#1d56c4; --sky-b:#5a9ae4; --sky-c:#bcdcf6; --hill-a:#56a523; --hill-b:#3b8416;
  --frame:#0a47e0; --frame-dk:#0831b8; --face:#ece9d8; --face-dk:#aca899; --edge:#7f9db9; --sel:#316ac5;
  --ink:#000; --ink-dim:#716f64; --white:#fff;
  --c-frag:#e5525b; --c-contig:#5b8def; --c-sys:#3cc15a; --c-free:#ffffff; --c-hot:#ffd800; --c-pf:#d08a1e; --c-mft:#c9c0e0; --c-pale:#ececec; --grid:#d2d2d2;

}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#245edb;color:var(--ink);font:11px/1.3 var(--ui);display:flex;flex-direction:column;overflow:hidden}
button,select{font:11px var(--ui);color:var(--ink)}
[hidden]{display:none!important}

/* desktop */
.desktop{flex:1;min-height:0;overflow:auto;

    linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 52%,var(--sky-c) 100%);}
.desk-inner{min-height:100%;display:flex;gap:14px;align-items:flex-start;padding-block:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.icons{display:flex;flex-direction:column;gap:14px;width:76px;flex:none}
.dicon{background:none;border:0;color:#fff;text-shadow:1px 1px 1px #000;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;cursor:default;width:76px}
.dicon:hover,.dicon:focus-visible{background:rgba(49,106,197,.45);outline:1px dotted #fff}

.win{width:min(860px,100%);background:var(--frame);border-radius:8px 8px 0 0;padding:0 3px 3px;position:relative;

.tb{height:30px;display:flex;align-items:center;gap:6px;padding:0 5px 0 6px;border-radius:7px 7px 0 0;touch-action:none;user-select:none;

.cap{display:flex;gap:2px}
.cb{width:21px;height:21px;padding:0;border:1px solid #fff;border-radius:3px;cursor:default;

.cb.x{background:radial-gradient(circle at 90% 90%,#cc4600 0%,#dc6527 55%,#cd7546 90%,#ffccb2 100%)}
.cb:hover{filter:brightness(1.12)}.cb:active{filter:brightness(.9)}
.cb svg{display:block;width:19px;height:19px}
.body{background:var(--face);position:relative}

/* menu bar */
.menubar{display:flex;position:relative;border-bottom:1px solid #fff;box-shadow:0 1px 0 var(--face-dk);padding:1px 2px}
.mi{background:none;border:0;padding:3px 8px;cursor:default}
.mi:hover,.mi.on{background:var(--sel);color:#fff}
.dd{position:absolute;top:100%;z-index:20;min-width:170px;background:#fff;border:1px solid var(--face-dk);box-shadow:2px 2px 3px rgba(0,0,0,.35);padding:2px}

.stage{position:relative}

.taskbar{height:30px;flex:none;background:linear-gradient(180deg,#245edb 0%,#3f8cf3 9%,#245edb 18%,#245edb 92%,#1941a5 100%);position:relative}

.start{border:0;padding:0 22px 0 14px;border-radius:0 12px 12px 0;color:#fff;font:italic 700 18px var(--title);text-shadow:1px 1px 2px #1e4a14;letter-spacing:.5px;

.start:hover{filter:brightness(1.08)}
.twin{align-self:center;height:24px;width:min(170px,40%);min-width:0;border:1px solid #1b4fb8;border-radius:3px;color:#fff;text-align:left;padding:0 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;

.tray{margin-left:auto;display:flex;align-items:center;padding:0 12px;color:#fff;border-left:1px solid #0b3b94;background:linear-gradient(180deg,#0f9bef,#1290e8 6%,#0f84e0 50%,#0a6fcb);box-shadow:inset 1px 0 #3bb2f4}
.smenu{position:absolute;left:0;bottom:30px;width:min(250px,100%);background:#fff;border:2px solid #245edb;border-bottom:0;border-radius:6px 6px 0 0;z-index:40;overflow:hidden;box-shadow:2px -2px 8px rgba(0,0,0,.4)}
.smenu .sh{background:linear-gradient(180deg,#2a6cf0,#1c4fc4);color:#fff;font:700 14px var(--title);padding:10px 12px;text-shadow:1px 1px #0b2f8a}
.smenu button{display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;padding:8px 12px;text-align:left;font-size:12px}

@media (max-width:820px){.desk-inner{flex-direction:column;align-items:stretch;gap:8px}.icons{flex-direction:row;width:auto;gap:8px}.stage{flex:none}}
